; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:m5stack-cardputer]
board = esp32s3
board_build.arduino.memory_type = qio_qspi
board_build.partitions = support_files/omarchy_cardputer_8Mb.csv # Larger Launcher partition for the screensaver
# board_build.partitions = support_files/custom_8Mb2.csv # debug
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
build_src_filter =${env.build_src_filter} +<../boards/m5stack-cardputer>
build_flags =
	${env.build_flags}
	-DM5STACK
	-DARDUINO_USB_MODE=1
	-DARDUINO_M5STACK_CARDPUTER=1 # Enable lib\Keyboard\Keyboard*.* files

	-DARDUINO_USB_CDC_ON_BOOT=1
	-DDEVICE_NAME='"M5Stack Cardputer"'
	-DOTA_TAG='"cardputer"'

	-D LAUNCHER_DEFAULT_SPIFFS_THRESHOLD=0x500000
	-D HAS_KEYBOARD=1
	'-DRESERVED_NAV_KEYS=",\;/\`."'

	-DROTATION=1

	-DOMARCHY_SCREENSAVER=1 # Omarchy logo screensaver after 150 s idle (src/omarchy_screensaver.cpp)
	-DOMARCHY_GROK=1        # Talk to Grok out loud (src/omarchy_grok.cpp)
	-DOMARCHY_TILE_MENU=1   # Main menu as sliding colour tiles (src/omarchy_tile_menu.cpp)
	-DOMARCHY_CLOCK=1       # Set the clock from the internet when WiFi connects (src/omarchy_clock.cpp)
	-DOMARCHY_WIFI_AT_LAUNCH=1 # Join a saved WiFi network when the Launcher starts, and stay on it (src/onlineLauncher.cpp)
	-DDIMMER_SETUP=0        # Dimming off by default, so it doesn't hide the screensaver

	-DANALOG_BAT_PIN=10

	-DTFT_DATABUS_N=0        # Arduino_HWSPI
	-DTFT_DISPLAY_DRIVER_N=1 # Arduino_ST7789
	-DTFT_WIDTH=135
	-DTFT_HEIGHT=240
	-DTFT_BL=38
	-DTFT_RST=33
	-DTFT_DC=34
	-DTFT_MOSI=35
	-DTFT_SCLK=36
	-DTFT_CS=37

	-D TFT_IPS=1
	-D TFT_COL_OFS1=52
	-D TFT_ROW_OFS1=40
	-D TFT_COL_OFS2=53
	-D TFT_ROW_OFS2=40

	-DSDCARD_CS=12
	-DSDCARD_SCK=40
	-DSDCARD_MISO=39
	-DSDCARD_MOSI=14

lib_deps =
	${env.lib_deps}
	adafruit/Adafruit TCA8418 @ ^1.0.1

lib_ignore =
	SensorLib
	XPowersLib
