<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#030705">
<title>launcher &middot; log in</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 54 52'><path fill='%2300ff9c' d='M0 0h54v4h-54zM0 4h4v4h-4zM25 4h4v4h-4zM50 4h4v4h-4zM0 8h4v4h-4zM8 8h21v4h-21zM38 8h8v4h-8zM50 8h4v4h-4zM0 12h4v12h-4zM8 12h4v12h-4zM42 12h4v12h-4zM50 12h4v12h-4zM0 24h12v4h-12zM42 24h4v4h-4zM50 24h4v4h-4zM0 28h4v12h-4zM8 28h4v12h-4zM42 28h4v12h-4zM50 28h4v12h-4zM0 40h4v4h-4zM8 40h38v4h-38zM50 40h4v4h-4zM0 44h4v4h-4zM25 44h4v4h-4zM50 44h4v4h-4zM0 48h29v4h-29zM34 48h20v4h-20z'/></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="login">
  <form class="win" action="/login" method="POST">
    <h2>log in</h2>
    <!-- Omarchy's logo, from its icon.txt. Omarchy is MIT licensed, (c) David Heinemeier Hansson. -->
    <svg class="gl" viewBox="0 0 54 52" aria-hidden="true"><path d="M0 0h54v4h-54zM0 4h4v4h-4zM25 4h4v4h-4zM50 4h4v4h-4zM0 8h4v4h-4zM8 8h21v4h-21zM38 8h8v4h-8zM50 8h4v4h-4zM0 12h4v12h-4zM8 12h4v12h-4zM42 12h4v12h-4zM50 12h4v12h-4zM0 24h12v4h-12zM42 24h4v4h-4zM50 24h4v4h-4zM0 28h4v12h-4zM8 28h4v12h-4zM42 28h4v12h-4zM50 28h4v12h-4zM0 40h4v4h-4zM8 40h38v4h-38zM50 40h4v4h-4zM0 44h4v4h-4zM25 44h4v4h-4zM50 44h4v4h-4zM0 48h29v4h-29zM34 48h20v4h-20z"/></svg>
    <p class="name">launcher</p>
    <p id="msg" class="warn" hidden></p>
    <input name="username" placeholder="username" autocomplete="username" required autofocus aria-label="Username">
    <input name="password" type="password" placeholder="password" autocomplete="current-password" required aria-label="Password">
    <button class="pri">log in</button>
    <p class="note">The device shows the login on its screen while Web UI runs.</p>
  </form>
</main>
<script>
(() => {
  const q = new URLSearchParams(location.search), m = document.getElementById('msg');
  const t = q.has('failed') ? 'Wrong username or password.' : q.has('loggedout') ? 'Logged out.' : '';
  if (t) { m.textContent = t; m.hidden = false; }
  if (q.has('loggedout')) m.className = 'note';
})();
</script>
</body>
</html>
